<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lectra — Flashcards</title>
  <meta name="description" content="Lectra Flashcards — generate on demand, keeps exact count, simple reveal flip." />
  <link rel="icon" href="data:,">
  <!-- Preload both logos for instant theme swap -->
  <link rel="preload" as="image" href="light.png">
  <link rel="preload" as="image" href="dark.png">

  <style>
    /* ========= Tokens (synced with index) ========= */
    :root{
      --bg:           hsl(252 58% 98%);
      --text:         hsl(230 35% 14%);
      --muted:        hsl(231 14% 44%);
      --border:       hsl(230 22% 88%);
      --accent:       hsl(212 100% 50%);
      --accent-600:   hsl(212 100% 46%);
      --accent-700:   hsl(212 100% 40%);
      --glow:         hsl(152 72% 42%);
      --citrus:       hsl(48 100% 55%);
      --surface:      hsl(0 0% 100%);
      --radius:       18px;
      --shadow:       0 10px 30px hsl(230 30% 10% / 0.08);
      /* dynamic wallpaper tokens */
      --bg1: hsl(226 70% 98%);
      --bg2: hsl(210 100% 97%);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:         hsl(222 28% 8%);
        --text:       hsl(210 20% 96%);
        --muted:      hsl(220 10% 70%);
        --border:     hsl(220 14% 18%);
        --accent:     hsl(212 100% 50%);
        --accent-600: hsl(212 100% 46%);
        --accent-700: hsl(212 100% 40%);
        --surface:    hsl(222 28% 10%);
        --shadow:     0 10px 30px hsl(220 40% 2% / 0.6);
        --bg1:        hsl(240 12% 9%);
        --bg2:        hsl(220 14% 12%);
      }
    }
    :root[data-theme="dark"]{
      --bg:         hsl(222 28% 8%);
      --text:       hsl(210 20% 96%);
      --muted:      hsl(220 10% 70%);
      --border:     hsl(220 14% 18%);
      --accent:     hsl(212 100% 50%);
      --accent-600: hsl(212 100% 46%);
      --accent-700: hsl(212 100% 40%);
      --surface:    hsl(222 28% 10%);
      --shadow:     0 10px 30px hsl(220 40% 2% / 0.6);
      --bg1:        hsl(240 12% 9%);
      --bg2:        hsl(220 14% 12%);
      color-scheme: dark;
    }

    /* ========= Reset / base ========= */
    *,*::before,*::after{ box-sizing:border-box; }
    body{ margin:0; font:16px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:var(--text); background:var(--bg); }
    a{ color:inherit; text-decoration:none; }
    .container{ width:min(1100px,92%); margin-inline:auto; }

    /* ===== BOLD Dynamic wallpaper (synced with index) ===== */
    body::before{
      content:"";
      position: fixed; inset: 0; z-index:-4;
      background:
        radial-gradient(1600px 900px at 10% 5%, color-mix(in oklab, var(--accent) 35%, white 10%) 0%, transparent 60%),
        radial-gradient(1400px 800px at 90% 30%, color-mix(in oklab, var(--glow) 38%, white 6%) 0%, transparent 65%),
        radial-gradient(1200px 700px at 50% 95%, color-mix(in oklab, var(--citrus) 34%, white 8%) 0%, transparent 70%),
        conic-gradient(from 210deg at 50% 50%,
          color-mix(in oklab, var(--bg1) 65%, transparent) 0 25%,
          transparent 25% 50%,
          color-mix(in oklab, var(--bg2) 60%, transparent) 50% 75%,
          transparent 75% 100%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      animation: bgPan 30s ease-in-out infinite alternate, bgTilt 18s ease-in-out infinite alternate;
      will-change: transform, filter;
    }
    @keyframes bgPan{ 0%{transform:translate3d(0,-1%,0) scale(1.02)}100%{transform:translate3d(0,2%,0) scale(1.06)} }
    @keyframes bgTilt{ 0%{filter:hue-rotate(0) saturate(1.05)}100%{filter:hue-rotate(8deg) saturate(1.15)} }

    /* floating blurred color orbs */
    .bg-orbs{ position: fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
    .bg-orbs .orb{ position:absolute; border-radius:50%; filter: blur(60px); mix-blend-mode:screen; opacity:.5; transform: translate(-50%,-50%); animation: float 22s ease-in-out infinite; }
    .bg-orbs .o1{ width:520px; height:520px; left:12%; top:26%; background: radial-gradient(circle at 40% 40%, color-mix(in oklab, var(--accent) 70%, white 10%), transparent 60%); animation-duration: 26s; animation-delay: -6s; }
    .bg-orbs .o2{ width:640px; height:640px; left:86%; top:18%; background: radial-gradient(circle at 60% 50%, color-mix(in oklab, var(--glow) 70%, white 10%), transparent 60%); animation-duration: 28s; animation-delay: -2s; }
    .bg-orbs .o3{ width:560px; height:560px; left:72%; top:78%; background: radial-gradient(circle at 50% 60%, color-mix(in oklab, var(--citrus) 75%, white 8%), transparent 60%); animation-duration: 24s; animation-delay: -10s; }
    @keyframes float{ 0%{transform:translate(-50%,-50%) translate3d(0,0,0) scale(1)}50%{transform:translate(-50%,-50%) translate3d(2%,-2%,0) scale(1.04)}100%{transform:translate(-50%,-50%) translate3d(-1%,2%,0) scale(1)} }

    /* grain */
    body::after{
      content:""; position: fixed; inset:0; z-index:-2; pointer-events:none;
      background-image: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">\
<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer></filter>\
<rect width="100%" height="100%" filter="url(#n)"/></svg>');
      opacity:.09; mix-blend-mode:multiply;
    }

    @media (prefers-reduced-motion: reduce){
      body::before, .bg-orbs .orb{ animation:none !important; }
      body::after{ opacity:.05; }
    }

    /* ===== Header / Nav ===== */
    header{ position:sticky; top:0; z-index:10; backdrop-filter: blur(8px); background: color-mix(in oklab, var(--bg) 70%, transparent); border-bottom:1px solid var(--border); }
    .nav{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; }
    .brand{ display:flex; align-items:center; gap:10px; font-weight:700; }
    .brand-logo{ width:40px; height:40px; object-fit:contain; display:block; border-radius:8px; }
    .nav ul{ list-style:none; display:flex; gap:clamp(14px,3vw,28px); margin:0; padding:0; }

    /* ===== Buttons (shiny primary) ===== */
    .btn{ display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-weight:600; cursor:pointer; transition: transform 120ms ease, background 120ms ease, border-color 120ms ease, box-shadow 120ms ease; }
    .btn[disabled]{ opacity:.6; cursor:not-allowed; }
    .btn-primary{ background:var(--accent); border:2px solid var(--accent-700); color:#fff; box-shadow: var(--shadow); position:relative; overflow:hidden; }
    .btn-primary:hover{ transform: translateY(-1px); filter: saturate(1.05) brightness(1.02); }
    .btn-primary::before{
      content:""; position:absolute; inset:-40% -60% auto auto; height:200%; width:40%;
      transform: rotate(15deg) translateX(-120%);
      background: linear-gradient(to right, transparent, hsl(0 0% 100% / .35), transparent);
      mix-blend-mode: screen; transition: transform .6s cubic-bezier(.2,.6,.2,1);
    }
    .btn-primary:hover::before{ transform: rotate(15deg) translateX(180%); }
    .btn-ghost{ background:transparent; }

    /* ===== Layout ===== */
    main{ padding-block: clamp(44px,6vw,72px); }
    .page-head{ display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:16px; }
    h1{ font-size: clamp(1.8rem, 4.4vw, 2.4rem); line-height:1.15; margin:0; }
    .eyebrow{ font-size:.9rem; color:var(--muted); letter-spacing:.18em; text-transform:uppercase; }

    .grid{ display:grid; gap:18px; grid-template-columns:1fr; }
    .card{ background:var(--surface); border:1.5px solid var(--border); border-radius:calc(var(--radius) + 6px); padding:18px; box-shadow:var(--shadow), inset 0 0 0 4px hsl(0 0% 100% / .6); }

    .muted{ color:var(--muted); }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

    /* Generator */
    .gen-panel{ display:grid; gap:10px; }
    .gen-panel textarea{ width:100%; min-height:140px; border:1px solid var(--border); border-radius:12px; padding:10px; background:var(--surface); color:var(--text); }

    /* Flashcard deck */
    .deck-wrap{ display:grid; gap:16px; }
    .cardBox{
      position: relative;
      width: 100%;
      min-height: 240px;
      border:1.5px solid var(--border);
      border-radius: 24px;
      background:var(--surface);
      box-shadow:var(--shadow);
      display:grid; place-items:center;
      cursor:pointer;
      overflow:hidden;
    }
    .faceText{ max-width: 90ch; font-size:1.05rem; line-height:1.5; padding:22px; transition: opacity .18s ease; }
    .hidden{ opacity:0; pointer-events:none; position:absolute; }
    .visible{ opacity:1; }

    .controls{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .group{ display:flex; gap:10px; flex-wrap:wrap; }
    .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.85rem; border:1px solid var(--border); background: hsl(212 100% 50% / .10); }
    .hard{ background: hsl(12 90% 50% / .12); }

    footer{ border-top:1px solid var(--border); padding:20px 0 60px; color:var(--muted); }
  </style>
</head>
<body>
  <!-- Bold wallpaper floating orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
  </div>

  <header>
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Lectra Home">
        <img id="brandLogo" class="brand-logo" src="light.png" alt="Lectra logo" />
        <span>Lectra</span>
      </a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="index.html#lab">Study Lab</a></li>
          <li><button id="themeToggle" class="btn btn-ghost" aria-pressed="false">🌙 Dark</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <div class="eyebrow">Study Mode</div>
          <h1>Flashcards</h1>
        </div>
        <a class="btn" href="index.html#lab">← Back</a>
      </div>

      <div class="grid">
        <!-- Generator (visible first; deck hidden until generated) -->
        <section id="genSection" class="card">
          <h3 style="margin:0 0 8px">Generate a Flashcard Deck</h3>
          <div class="gen-panel">
            <textarea id="studyText" placeholder="This is the note text. We’ll try to prefill from your selected note."></textarea>
            <div class="row">
              <div class="field">Cards
                <input id="count" type="number" min="5" max="80" value="20" style="width:90px; padding:6px 8px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text)">
              </div>
              <button id="genBtn" class="btn btn-primary" type="button">Generate Deck</button>
              <span id="genMsg" class="muted"></span>
            </div>
            <p class="muted" id="noteHint" style="margin:6px 0 0"></p>
          </div>
        </section>

        <!-- Deck -->
        <section id="deckSection" class="card" style="display:none">
          <div class="deck-wrap">
            <div class="controls">
              <div class="group">
                <span class="pill">Card <strong id="pos">0</strong>/<span id="total">0</span></span>
                <span class="pill hard">Hard: <strong id="hardCount">0</strong></span>
              </div>
              <div class="group">
                <button id="prevBtn" class="btn" type="button">Prev</button>
                <button id="flipBtn" class="btn btn-primary" type="button">Show Answer</button>
                <button id="nextBtn" class="btn" type="button">Next</button>
                <button id="shuffleBtn" class="btn" type="button">Shuffle</button>
                <button id="hardBtn" class="btn" type="button">Mark Hard</button>
              </div>
            </div>

            <div class="stage">
              <div id="cardBox" class="cardBox" aria-live="polite">
                <div id="front" class="faceText visible"></div>
                <div id="back"  class="faceText hidden"></div>
              </div>
            </div>
          </div>
        </section>
      </div>

    </div>
  </main>

  <footer>
    <div class="container"><small>© <span id="year"></span> Lectra</small></div>
  </footer>

  <script>
    // Footer year
    (function(){ var y=document.getElementById('year'); if(y) y.textContent = new Date().getFullYear(); })();

    // Theme toggle + LOGO SWAP
    (function(){
      var STORAGE_KEY='lectra.theme';
      var LIGHT_LOGO = 'light.png';
      var DARK_LOGO  = 'dark.png';
      var logoEl = document.getElementById('brandLogo');
      var media = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

      function setLogo(theme){
        if(!logoEl) return;
        var isDark = theme === 'dark';
        logoEl.src = isDark ? DARK_LOGO : LIGHT_LOGO;
        logoEl.alt = isDark ? 'Lectra logo (dark)' : 'Lectra logo (light)';
      }
      function apply(theme){
        var btn=document.getElementById('themeToggle');
        if(theme==='dark'){
          document.documentElement.setAttribute('data-theme','dark');
          if(btn){ btn.textContent='🌞 Light'; btn.setAttribute('aria-pressed','true'); }
        } else {
          document.documentElement.removeAttribute('data-theme');
          if(btn){ btn.textContent='🌙 Dark'; btn.setAttribute('aria-pressed','false'); }
        }
        setLogo(theme);
      }
      function initial(){
        try{ var saved=localStorage.getItem(STORAGE_KEY); if(saved==='light'||saved==='dark') return saved; }catch(e){}
        return (media && media.matches)?'dark':'light';
      }
      var current=initial(); apply(current);

      var btn=document.getElementById('themeToggle');
      if(btn){
        btn.addEventListener('click', function(){
          current=(document.documentElement.getAttribute('data-theme')==='dark')?'light':'dark';
          try{ localStorage.setItem(STORAGE_KEY,current);}catch(e){}
          apply(current);
        });
      }
      if (media && typeof media.addEventListener === 'function'){
        media.addEventListener('change', function(e){
          try{ var saved=localStorage.getItem(STORAGE_KEY); if(saved==='light'||saved==='dark') return; }catch(e){}
          current = e.matches ? 'dark' : 'light';
          apply(current);
        });
      }
    })();

    // ===================== CONFIG =====================
    const API_BASE = 'https://api.lectra.work';

    // ===================== STALE PROTECTION =================
    try { localStorage.removeItem('lectra.cards'); } catch(_) {}

    // ===================== ELEMENTS ========================
    const genSection  = document.getElementById('genSection');
    const deckSection = document.getElementById('deckSection');
    const studyTextEl = document.getElementById('studyText');
    const countEl     = document.getElementById('count');
    const genBtn      = document.getElementById('genBtn');
    const genMsg      = document.getElementById('genMsg');
    const noteHint    = document.getElementById('noteHint');

    const posEl   = document.getElementById('pos');
    const totalEl = document.getElementById('total');
    const hardCountEl = document.getElementById('hardCount');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const flipBtn = document.getElementById('flipBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const hardBtn = document.getElementById('hardBtn');

    const cardBox = document.getElementById('cardBox');
    const frontEl = document.getElementById('front');
    const backEl  = document.getElementById('back');

    // ===================== PREFILL / GUARD ==================
    try {
      const pref = localStorage.getItem('lectra.studyText');
      if (pref) {
        studyTextEl.value = pref;
        noteHint.textContent = 'Loaded note text from your selection.';
      } else {
        noteHint.textContent = 'Tip: Select a note in Study Lab to prefill this box automatically, or paste text here.';
      }
    } catch(_) {}

    // ===================== STATE ===========================
    let cards = [];           // [{front, back}]
    let idx = 0;
    let showingBack = false;
    const hard = new Set();   // indices marked hard

    // ===================== RENDER ==========================
    function render(){
      if (!cards.length){
        deckSection.style.display = 'none';
        genSection.style.display  = 'block';
        return;
      }
      genSection.style.display  = 'none';
      deckSection.style.display = 'block';

      const c = cards[idx];
      posEl.textContent   = (idx + 1).toString();
      totalEl.textContent = cards.length.toString();
      hardCountEl.textContent = hard.size.toString();

      frontEl.textContent = c.front || '—';
      backEl .textContent = c.back  || '—';

      if (showingBack) {
        frontEl.classList.remove('visible'); frontEl.classList.add('hidden');
        backEl.classList.remove('hidden');   backEl.classList.add('visible');
        flipBtn.textContent = 'Show Question';
      } else {
        backEl.classList.remove('visible');  backEl.classList.add('hidden');
        frontEl.classList.remove('hidden');  frontEl.classList.add('visible');
        flipBtn.textContent = 'Show Answer';
      }
    }

    // ===================== CONTROLS ========================
    function flip(){ showingBack = !showingBack; render(); }
    function next(){ if (idx < cards.length-1){ idx++; showingBack=false; render(); } }
    function prev(){ if (idx > 0){ idx--; showingBack=false; render(); } }
    function shuffle(){
      for (let i = cards.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      idx = 0; showingBack=false; render();
    }
    function toggleHard(){
      if (hard.has(idx)) hard.delete(idx); else hard.add(idx);
      render();
    }

    cardBox.addEventListener('click', flip);
    flipBtn.addEventListener('click', flip);
    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);
    shuffleBtn.addEventListener('click', shuffle);
    hardBtn.addEventListener('click', toggleHard);

    // ===================== BACKEND CALL ====================
    async function callBackendGenerateCards(text, count){
      const r = await fetch(`${API_BASE}/api/generate-flashcards`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ text, count })
      });
      if(!r.ok) return null;
      const data = await r.json();
      return Array.isArray(data.cards) ? data.cards : null;
    }

    function normalizeCards(list){
      const out = [];
      const seen = new Set();
      for (const c of list || []){
        const front = (c?.front || '').trim();
        const back  = (c?.back  || '').trim();
        if (!front || !back) continue;
        const key = front.toLowerCase() + '␞' + back.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({ front, back });
      }
      return out;
    }

    async function generateDeckExactCount(text, targetCount){
      genMsg.textContent = 'Generating…';
      let all = [];
      let remaining = targetCount;
      let attempts = 0;

      while (remaining > 0 && attempts < 3){
        attempts++;
        const got = await callBackendGenerateCards(text, remaining);
        if (!got) break;

        const merged = normalizeCards([...all, ...got]);
        const delta = merged.length - all.length;
        all = merged;
        remaining = Math.max(0, targetCount - all.length);

        if (delta === 0) break;
      }

      if (all.length < targetCount){
        genMsg.textContent = `Generated ${all.length}/${targetCount}. Add more note text for a bigger deck.`;
      } else {
        genMsg.textContent = 'Done!';
      }
      return all.slice(0, targetCount);
    }

    // ===================== GENERATE HANDLER =================
    genBtn.addEventListener('click', async ()=>{
      const text = (studyTextEl.value || '').trim();
      if (!text){ genMsg.textContent = 'Paste study text first (or select a note in Study Lab).'; return; }

      const target = Math.max(5, Math.min(80, parseInt(countEl.value || '20', 10)));

      const generated = await generateDeckExactCount(text, target);
      if (!generated || !generated.length){ genMsg.textContent = 'Failed to generate. Check backend or provide more text.'; return; }

      cards = generated;
      idx = 0; showingBack = false;
      hard.clear();

      try { localStorage.setItem('lectra.cards', JSON.stringify(cards)); } catch(_) {}

      render();
    });

    // ===================== INIT ============================
    render();
  </script>
</body>
</html>
