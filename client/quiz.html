<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lectra — Quiz</title>
  <meta name="description" content="Lectra Quiz Mode — generate on demand, no stale data, lock-after-first-click, Finish only when all answered." />
  <link rel="icon" href="data:,">
  <!-- Preload both logos for instant theme swap -->
  <link rel="preload" as="image" href="light.png">
  <link rel="preload" as="image" href="dark.png">

  <style>
    /* ========= Tokens (synced with index) ========= */
    :root{
      --bg:           hsl(252 58% 98%);
      --text:         hsl(230 35% 14%);
      --muted:        hsl(231 14% 44%);
      --border:       hsl(230 22% 88%);
      --accent:       hsl(212 100% 50%);
      --accent-600:   hsl(212 100% 46%);
      --accent-700:   hsl(212 100% 40%);
      --glow:         hsl(152 72% 42%);
      --citrus:       hsl(48 100% 55%);
      --surface:      hsl(0 0% 100%);
      --radius:       16px;
      --shadow:       0 10px 30px hsl(230 30% 10% / 0.08);
      /* dynamic wallpaper tokens */
      --bg1: hsl(226 70% 98%);
      --bg2: hsl(210 100% 97%);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:         hsl(222 28% 8%);
        --text:       hsl(210 20% 96%);
        --muted:      hsl(220 10% 70%);
        --border:     hsl(220 14% 18%);
        --accent:     hsl(212 100% 50%);
        --accent-600: hsl(212 100% 46%);
        --accent-700: hsl(212 100% 40%);
        --surface:    hsl(222 28% 10%);
        --shadow:     0 10px 30px hsl(220 40% 2% / 0.6);
        --bg1:        hsl(240 12% 9%);
        --bg2:        hsl(220 14% 12%);
      }
    }
    :root[data-theme="dark"]{
      --bg:         hsl(222 28% 8%);
      --text:       hsl(210 20% 96%);
      --muted:      hsl(220 10% 70%);
      --border:     hsl(220 14% 18%);
      --accent:     hsl(212 100% 50%);
      --accent-600: hsl(212 100% 46%);
      --accent-700: hsl(212 100% 40%);
      --surface:    hsl(222 28% 10%);
      --shadow:     0 10px 30px hsl(220 40% 2% / 0.6);
      --bg1:        hsl(240 12% 9%);
      --bg2:        hsl(220 14% 12%);
      color-scheme:dark;
    }

    /* ========= Reset / base ========= */
    *,*::before,*::after{ box-sizing:border-box; }
    body{ margin:0; font:16px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:var(--text); background:var(--bg); }
    a{ color:inherit; text-decoration:none; }
    .container{ width:min(1100px,92%); margin-inline:auto; }

    /* ===== BOLD Dynamic wallpaper (synced with index) ===== */
    body::before{
      content:"";
      position: fixed; inset: 0; z-index:-4;
      background:
        radial-gradient(1600px 900px at 10% 5%, color-mix(in oklab, var(--accent) 35%, white 10%) 0%, transparent 60%),
        radial-gradient(1400px 800px at 90% 30%, color-mix(in oklab, var(--glow) 38%, white 6%) 0%, transparent 65%),
        radial-gradient(1200px 700px at 50% 95%, color-mix(in oklab, var(--citrus) 34%, white 8%) 0%, transparent 70%),
        conic-gradient(from 210deg at 50% 50%,
          color-mix(in oklab, var(--bg1) 65%, transparent) 0 25%,
          transparent 25% 50%,
          color-mix(in oklab, var(--bg2) 60%, transparent) 50% 75%,
          transparent 75% 100%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      animation: bgPan 30s ease-in-out infinite alternate, bgTilt 18s ease-in-out infinite alternate;
      will-change: transform, filter;
    }
    @keyframes bgPan{ 0%{transform:translate3d(0,-1%,0) scale(1.02)}100%{transform:translate3d(0,2%,0) scale(1.06)} }
    @keyframes bgTilt{ 0%{filter:hue-rotate(0) saturate(1.05)}100%{filter:hue-rotate(8deg) saturate(1.15)} }

    /* floating blurred color orbs */
    .bg-orbs{ position: fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
    .bg-orbs .orb{ position:absolute; border-radius:50%; filter: blur(60px); mix-blend-mode:screen; opacity:.5; transform: translate(-50%,-50%); animation: float 22s ease-in-out infinite; }
    .bg-orbs .o1{ width:520px; height:520px; left:12%; top:26%; background: radial-gradient(circle at 40% 40%, color-mix(in oklab, var(--accent) 70%, white 10%), transparent 60%); animation-duration: 26s; animation-delay: -6s; }
    .bg-orbs .o2{ width:640px; height:640px; left:86%; top:18%; background: radial-gradient(circle at 60% 50%, color-mix(in oklab, var(--glow) 70%, white 10%), transparent 60%); animation-duration: 28s; animation-delay: -2s; }
    .bg-orbs .o3{ width:560px; height:560px; left:72%; top:78%; background: radial-gradient(circle at 50% 60%, color-mix(in oklab, var(--citrus) 75%, white 8%), transparent 60%); animation-duration: 24s; animation-delay: -10s; }
    @keyframes float{ 0%{transform:translate(-50%,-50%) translate3d(0,0,0) scale(1)}50%{transform:translate(-50%,-50%) translate3d(2%,-2%,0) scale(1.04)}100%{transform:translate(-50%,-50%) translate3d(-1%,2%,0) scale(1)} }

    /* grain */
    body::after{
      content:""; position: fixed; inset:0; z-index:-2; pointer-events:none;
      background-image: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">\
<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer></filter>\
<rect width="100%" height="100%" filter="url(#n)"/></svg>');
      opacity:.09; mix-blend-mode:multiply;
    }

    @media (prefers-reduced-motion: reduce){
      body::before, .bg-orbs .orb{ animation:none !important; }
      body::after{ opacity:.05; }
    }

    /* ===== Header / Nav ===== */
    header{ position:sticky; top:0; z-index:10; backdrop-filter: blur(8px); background: color-mix(in oklab, var(--bg) 70%, transparent); border-bottom:1px solid var(--border); }
    .nav{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; }
    .brand{ display:flex; align-items:center; gap:10px; font-weight:700; }
    .brand-logo{ width:40px; height:40px; object-fit:contain; display:block; border-radius:8px; }
    .nav ul{ list-style:none; display:flex; gap:clamp(14px,3vw,28px); margin:0; padding:0; }

    /* ===== Buttons (shiny primary) ===== */
    .btn{ display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-weight:600; cursor:pointer; transition: transform 120ms ease, background 120ms ease, border-color 120ms ease, box-shadow 120ms ease; }
    .btn[disabled]{ opacity:.6; cursor:not-allowed; }
    .btn-primary{ background:var(--accent); border:2px solid var(--accent-700); color:#fff; box-shadow: var(--shadow); position:relative; overflow:hidden; }
    .btn-primary:hover{ transform: translateY(-1px); filter: saturate(1.05) brightness(1.02); }
    .btn-primary::before{
      content:""; position:absolute; inset:-40% -60% auto auto; height:200%; width:40%;
      transform: rotate(15deg) translateX(-120%);
      background: linear-gradient(to right, transparent, hsl(0 0% 100% / .35), transparent);
      mix-blend-mode: screen; transition: transform .6s cubic-bezier(.2,.6,.2,1);
    }
    .btn-primary:hover::before{ transform: rotate(15deg) translateX(180%); }
    .btn-ghost{ background:transparent; }

    /* ===== Layout ===== */
    main{ padding-block: clamp(44px,6vw,72px); }
    .page-head{ display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:16px; }
    h1{ font-size: clamp(1.8rem, 4.4vw, 2.4rem); line-height:1.15; margin:0; }
    .eyebrow{ font-size:.9rem; color:var(--muted); letter-spacing:.18em; text-transform:uppercase; }

    .grid{ display:grid; gap:18px; grid-template-columns:1fr; }
    .card{ background:var(--surface); border:1.5px solid var(--border); border-radius:calc(var(--radius) + 6px); padding:18px; box-shadow:var(--shadow), inset 0 0 0 4px hsl(0 0% 100% / .6); }

    /* Quiz layout */
    .quiz-stage{ display:grid; gap:16px; }
    .quiz-meta{ display:flex; gap:8px; justify-content:space-between; align-items:center; }
    .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.8rem; background:hsl(212 100% 50% / .12); border:1px solid var(--border); }
    .pill.alt{ background:hsl(48 100% 55% / .14); }
    .question{ font-size:1.1rem; margin:0; }
    .answers{ display:grid; gap:10px; }
    .answer{
      border:1px solid var(--border); background:var(--surface); padding:12px 14px; border-radius:14px; text-align:left; cursor:pointer;
      transition: box-shadow .15s ease, transform .02s ease, border-color .15s ease, background-color .15s ease;
    }
    .answer:hover{ border-color:var(--accent); box-shadow: 0 0 0 4px hsl(212 100% 50% / .14); }
    .answer[disabled]{ opacity:.7; cursor:not-allowed; }
    .answer.correct{ background: color-mix(in oklab, var(--glow) 12%, var(--surface)); border-color: color-mix(in oklab, var(--glow) 50%, var(--border)); }
    .answer.wrong{ background: color-mix(in oklab, crimson 10%, var(--surface)); border-color: color-mix(in oklab, crimson 50%, var(--border)); }

    .quiz-actions{ display:flex; gap:10px; justify-content:space-between; align-items:center; }
    .muted{ color:var(--muted); }

    .gen-panel{ display:grid; gap:10px; }
    .gen-panel textarea{ width:100%; min-height:140px; border:1px solid var(--border); border-radius:12px; padding:10px; background:var(--surface); color:var(--text); }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .row .field{ display:flex; gap:8px; align-items:center; }

    footer{ border-top:1px solid var(--border); padding:20px 0 60px; color:var(--muted); }
  </style>
</head>
<body>
  <!-- Bold wallpaper floating orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
  </div>

  <header>
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Lectra Home">
        <img id="brandLogo" class="brand-logo" src="light.png" alt="Lectra logo" />
        <span>Lectra</span>
      </a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="index.html#lab">Study Lab</a></li>
          <li><button id="themeToggle" class="btn btn-ghost" aria-pressed="false">🌙 Dark</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <div class="eyebrow">Study Mode</div>
          <h1>Quiz</h1>
        </div>
        <a class="btn" href="index.html#lab">← Back</a>
      </div>

      <div class="grid">
        <!-- Generator section (always shown first) -->
        <section id="genSection" class="card">
          <h3 style="margin:0 0 8px">Generate a Quiz</h3>
          <div class="gen-panel">
            <textarea id="studyText" placeholder="This is the note text. We’ll try to prefill from your selected note."></textarea>
            <div class="row">
              <div class="field">Count <input id="qCount" type="number" min="3" max="20" value="8" style="width:80px; padding:6px 8px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text)"></div>
              <div class="field">Difficulty
                <select id="difficulty" style="padding:6px 8px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text)">
                  <option>Easy</option><option selected>Medium</option><option>Hard</option>
                </select>
              </div>
              <button id="genBtn" class="btn btn-primary" type="button">Generate Quiz</button>
              <span id="genMsg" class="muted"></span>
            </div>
          </div>
        </section>

        <!-- Quiz stage (hidden until a quiz is generated) -->
        <section id="quizSection" class="card" aria-live="polite" style="display:none">
          <div class="quiz-stage">
            <div class="quiz-meta">
              <span class="pill">Q <strong id="qnum">0</strong>/<span id="qtotal">0</span></span>
              <span class="pill alt">Score: <strong id="score">0</strong></span>
            </div>
            <h3 id="question" class="question">Loading…</h3>
            <div id="answers" class="answers"></div>
            <div id="explain" class="muted" style="display:none; margin-top:6px;"></div>
            <div class="quiz-actions">
              <button id="prevBtn" class="btn" type="button">Previous</button>
              <div id="progress" class="muted"></div>
              <button id="nextBtn" class="btn btn-primary" type="button">Next</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <div class="container"><small>© <span id="year"></span> Lectra</small></div>
  </footer>

  <script>
    // Footer year
    (function(){ var y=document.getElementById('year'); if(y) y.textContent = new Date().getFullYear(); })();

    // Theme toggle + LOGO SWAP
    (function(){
      var STORAGE_KEY='lectra.theme';
      var LIGHT_LOGO = 'light.png';
      var DARK_LOGO  = 'dark.png';
      var logoEl = document.getElementById('brandLogo');
      var media = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

      function setLogo(theme){
        if(!logoEl) return;
        var isDark = theme === 'dark';
        logoEl.src = isDark ? DARK_LOGO : LIGHT_LOGO;
        logoEl.alt = isDark ? 'Lectra logo (dark)' : 'Lectra logo (light)';
      }
      function apply(theme){
        var btn=document.getElementById('themeToggle');
        if(theme==='dark'){
          document.documentElement.setAttribute('data-theme','dark');
          if(btn){ btn.textContent='🌞 Light'; btn.setAttribute('aria-pressed','true'); }
        } else {
          document.documentElement.removeAttribute('data-theme');
          if(btn){ btn.textContent='🌙 Dark'; btn.setAttribute('aria-pressed','false'); }
        }
        setLogo(theme);
      }
      function initial(){
        try{ var saved=localStorage.getItem(STORAGE_KEY); if(saved==='light'||saved==='dark') return saved; }catch(e){}
        return (media && media.matches)?'dark':'light';
      }
      var current=initial(); apply(current);

      var btn=document.getElementById('themeToggle');
      if(btn){
        btn.addEventListener('click', function(){
          current=(document.documentElement.getAttribute('data-theme')==='dark')?'light':'dark';
          try{ localStorage.setItem(STORAGE_KEY,current);}catch(e){}
          apply(current);
        });
      }
      if (media && typeof media.addEventListener === 'function'){
        media.addEventListener('change', function(e){
          try{ var saved=localStorage.getItem(STORAGE_KEY); if(saved==='light'||saved==='dark') return; }catch(e){}
          current = e.matches ? 'dark' : 'light';
          apply(current);
        });
      }
    })();

    // Config
    const API_BASE = 'https://api.lectra.work';

    // ======= State & Elements =======
    const genSection   = document.getElementById('genSection');
    const quizSection  = document.getElementById('quizSection');
    const studyTextEl  = document.getElementById('studyText');
    const genBtn       = document.getElementById('genBtn');
    const genMsg       = document.getElementById('genMsg');
    const qCountEl     = document.getElementById('qCount');
    const difficultyEl = document.getElementById('difficulty');

    const qnumEl     = document.getElementById('qnum');
    const qtotalEl   = document.getElementById('qtotal');
    const scoreEl    = document.getElementById('score');
    const questionEl = document.getElementById('question');
    const answersEl  = document.getElementById('answers');
    const explainEl  = document.getElementById('explain');
    const progressEl = document.getElementById('progress');
    const prevBtn    = document.getElementById('prevBtn');
    const nextBtn    = document.getElementById('nextBtn');

    // Never show stale quiz
    try { localStorage.removeItem('lectra.quiz'); } catch(_) {}

    // Prefill study text from selection if available
    try {
      const pref = localStorage.getItem('lectra.studyText');
      if (pref) studyTextEl.value = pref;
    } catch(_) {}

    let quiz = [];             // populated after generation
    let idx = 0;
    let answers = [];          // selected indices
    let locked  = [];          // lock each question after first click

    function correctCount() {
      return answers.reduce((acc, a, i) => (a !== null && a === quiz[i]?.correctIndex) ? acc + 1 : acc, 0);
    }
    function allAnswered(){ return quiz.length>0 && answers.length===quiz.length && answers.every(a => a !== null); }

    function render() {
      if (!quiz.length) {
        quizSection.style.display = 'none';
        genSection.style.display  = 'block';
        return;
      }

      genSection.style.display  = 'none';
      quizSection.style.display = 'block';

      const q = quiz[idx];
      qnumEl.textContent   = (idx + 1).toString();
      qtotalEl.textContent = quiz.length.toString();
      scoreEl.textContent  = correctCount().toString();
      questionEl.textContent = q.question || '—';
      progressEl.textContent = `Question ${idx+1} of ${quiz.length}`;

      // Build answers
      answersEl.innerHTML = q.choices.map((c,i)=>`
        <button class="answer" data-i="${i}" type="button">${c}</button>
      `).join('');

      const btns = [...answersEl.querySelectorAll('.answer')];

      // If already answered, paint + lock all
      if (answers[idx] !== null) {
        btns.forEach((b, bi)=>{
          b.classList.remove('correct','wrong');
          if (bi === q.correctIndex) b.classList.add('correct');
          if (bi === answers[idx] && answers[idx] !== q.correctIndex) b.classList.add('wrong');
          b.disabled = true;
        });
        explainEl.style.display = 'block';
        explainEl.innerHTML = `<strong>Explanation:</strong> ${q.explanation || '—'}`;
        locked[idx] = true;
      } else {
        explainEl.style.display = 'none';
        explainEl.textContent = '';
      }

      // First-click handler -> choose once, then lock
      btns.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if (locked[idx]) return;

          const sel = +btn.dataset.i;
          answers[idx] = sel;

          btns.forEach((b, bi)=>{
            b.classList.remove('correct','wrong');
            if (bi === q.correctIndex) b.classList.add('correct');
            if (bi === sel && sel !== q.correctIndex) b.classList.add('wrong');
            b.disabled = true; // lock all after first click
          });

          explainEl.style.display = 'block';
          explainEl.innerHTML = `<strong>Explanation:</strong> ${q.explanation || '—'}`;

          locked[idx] = true;
          scoreEl.textContent = correctCount().toString();

          // If on last question, update Finish enabled state
          if (idx === quiz.length - 1) {
            nextBtn.disabled = !allAnswered();
            nextBtn.title = nextBtn.disabled ? 'Answer all questions to finish' : '';
          }
        });
      });

      // Prev / Next / Finish logic
      prevBtn.disabled = idx === 0;

      const last = (idx === quiz.length - 1);
      nextBtn.textContent = last ? 'Finish' : 'Next';

      if (last) {
        nextBtn.disabled = !allAnswered();
        nextBtn.title = nextBtn.disabled ? 'Answer all questions to finish' : '';
      } else {
        nextBtn.disabled = false;
        nextBtn.title = '';
      }
    }

    // Navigation
    prevBtn.addEventListener('click', ()=>{ if (idx>0){ idx--; render(); } });
    nextBtn.addEventListener('click', ()=>{
      if (!quiz.length) return;
      const last = (idx === quiz.length - 1);

      if (!last) {
        idx++; render(); return;
      }

      // Last question → only allow if all answered
      if (!allAnswered()) {
        nextBtn.disabled = true;
        nextBtn.title = 'Answer all questions to finish';
        return;
      }

      alert('Quiz complete! 🎉');
    });

    // Backend call (only from here)
    async function callBackendGenerateQuiz(text, count, difficulty){
      genMsg.textContent = 'Generating…';
      const r = await fetch(`${API_BASE}/api/generate-quiz`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ text, count, difficulty, qtype:'Multiple Choice' })
      });
      if(!r.ok){
        genMsg.textContent = 'Failed to generate. Check backend.';
        return null;
      }
      const data = await r.json();
      return Array.isArray(data.quiz) ? data.quiz : null;
    }

    // Generate button
    genBtn.addEventListener('click', async ()=>{
      const text = (studyTextEl.value || '').trim();
      if (!text){ genMsg.textContent = 'Paste study text first.'; return; }
      const count = Math.max(3, Math.min(20, parseInt(qCountEl.value || '8', 10)));
      const difficulty = difficultyEl.value || 'Medium';

      const generated = await callBackendGenerateQuiz(text, count, difficulty);
      if (!generated){ return; }

      quiz = generated;
      answers = Array(quiz.length).fill(null);
      locked  = Array(quiz.length).fill(false);
      idx = 0;

      try { localStorage.setItem('lectra.quiz', JSON.stringify(quiz)); } catch(_) {}

      genMsg.textContent = 'Done!';
      render();
    });

    // First render (generator visible; quiz hidden)
    render();
  </script>
</body>
</html>
